name: Release Executables

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build standalone executables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun cross-compiles every target from a single runner.
      - name: Compile executables (Linux, macOS, Windows)
        run: bun run compile:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: u-unpack-executables
          path: |
            dist/u-unpack-linux-x64
            dist/u-unpack-linux-arm64
            dist/u-unpack-darwin-x64
            dist/u-unpack-darwin-arm64
            dist/u-unpack-windows-x64.exe
          if-no-files-found: error

      - name: Attach executables to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/u-unpack-linux-x64
            dist/u-unpack-linux-arm64
            dist/u-unpack-darwin-x64
            dist/u-unpack-darwin-arm64
            dist/u-unpack-windows-x64.exe
